# Gradle
org.gradle.jvmargs=-Xmx3G -Duser.language=en -Duser.country=US
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment Properties

# Core MC/Neo
minecraft_version=26.3
minecraft_version_range=[26.3]

# NeoForge: 26.3.x series is for MC 26.3
neo_version=26.3.0.100
neo_version_range=[26,)

# FML/Loader range (major)
loader_version_range=[4,)

# (Optional) Parchment — disabled by default; uncomment to use
# neogradle.subsystems.parchment.minecraftVersion=26.3
# neogradle.subsystems.parchment.mappingsVersion=<YYYY.MM.DD>-26.3

# Mappings (moddev uses official mappings by default; kept for reference)
mapping_channel=official
mapping_version=26.3

