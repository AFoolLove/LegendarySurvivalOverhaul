# Legendary Survival Overhaul — mod metadata (expanded by generateModMetadata)
modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/sfiomn/LegendarySurvivalOverhaul/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/sfiomn/LegendarySurvivalOverhaul"
iconFile = "logo.png"
credits = "Charles445, Icey"
authors = "${mod_authors}"
description = '''${mod_description}'''

# Optional third-party integrations are intentionally not declared yet:
# the 26.3 port is vanilla-only for now. They will be re-added with the compatibility pass.

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
