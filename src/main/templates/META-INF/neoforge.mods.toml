# Legendary Survival Overhaul — mod metadata (expanded by generateModMetadata)
modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/AFoolLove/LegendarySurvivalOverhaul/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
