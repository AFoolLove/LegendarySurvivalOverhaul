plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

// Artifact version, e.g. 26.3-2.4.7.2
version = minecraft_version + '-' + mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Local-only dev run: boots straight into the "LSO-Test" world (created via runServer and
        // copied into run/saves) so gameplay can be validated without manual menu interaction.
        clientGameplay {
            client()
            programArguments.addAll '--quickPlaySingleplayer', 'LSO-Test'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // 26.3 split datagen into DataClient (assets) and DataServer (server data). Each run removes
        // stale files from its own output dir, so the two targets must be different directories.
        serverData {
            serverData()
            programArguments.addAll '--mod', project.mod_id, '--server',
                    '--output', file('src/generated/datapack/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Resources generated by data generators: client assets (DataClient) and server data (DataServer)
// are generated into separate roots because each run cleans its output directory.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir 'src/generated/datapack'
}

// Third-party mod integrations are NOT part of the initial 26.3 port (vanilla-only migration).
// Their 1.21.1 sources are kept (not compiled) under src/integration-reference/java for a later
// compatibility pass; vanilla-only stub replacements live under src/main/java/.../integration.
// TODO(compat): restore the real integration sources once the vanilla port is green.

repositories {
    mavenLocal()
    mavenCentral()

    // JEI (mezz.jei) — optional integration APIs
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
    }
    // Curios (top.theillusivec4.curios) — optional integration
    maven {
        name = "Illusive Soulworks"
        url = "https://maven.theillusivec4.top/"
    }
}

dependencies {
    // --- Curios (optional integration; loaded at runtime in dev too) ---
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    // --- JEI (optional integration; compile against the 26.3 API artifacts) ---
    compileOnly "mezz.jei:jei-26.3-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-26.3-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-26.3-neoforge:${jei_version}"

    // --- Optional compat mods (jars in libs/, fetched by tools/fetch-compat-libs.ps1; not committed) ---
    compileOnly fileTree(dir: "libs", include: ["*.jar"])
    runtimeOnly fileTree(dir: "libs", include: ["*.jar"])
}

// Expand mod metadata declared in src/main/templates.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar).configure {
    manifest {
        attributes(['Specification-Title'     : mod_id,
                    'Specification-Vendor'    : mod_authors,
                    'Specification-Version'   : '1',
                    'Implementation-Title'    : project.name,
                    'Implementation-Version'  : mod_version,
                    'Implementation-Vendor'   : mod_authors])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Report all compile errors instead of stopping at the default 100 while porting.
    options.compilerArgs.addAll(['-Xmaxerrs', '5000'])
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
